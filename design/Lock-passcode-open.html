<style>
body{margin:0}
.pxf{font-family:'Press Start 2P',monospace}
.vt{font-family:'VT323',monospace}
.win{position:absolute;background:rgba(18,12,10,.82);border:1px solid #5a3626;box-sizing:border-box;padding:16px 20px;font-family:'VT323',monospace;font-size:27px;line-height:1.12;color:var(--k);animation:fadein .8s ease-out both,flt 6s ease-in-out infinite;animation-delay:var(--d,0s),var(--d,0s)}
.win::before{content:"";position:absolute;left:-1px;top:-1px;width:12px;height:12px;border-left:3px solid var(--c);border-top:3px solid var(--c)}
.win .t{color:var(--c)}.win .d{color:#9c8678}
.hd{font-family:'Press Start 2P',monospace;font-size:12px;letter-spacing:1px;color:var(--c);margin-bottom:12px}
.px{position:relative;background:#120d0b;border:2px solid #5a3626;box-shadow:4px 4px 0 #000;color:var(--c);display:flex;align-items:center;justify-content:center;cursor:pointer;box-sizing:border-box;margin:0;padding:0;transition:transform .1s steps(2)}
.px:hover,.px:focus-visible{border-color:var(--c);transform:translate(-2px,-2px);outline:none;box-shadow:6px 6px 0 #000}
.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square;stroke-linejoin:miter;width:40px;height:40px}
.seg{height:10px;background:#1c1411}
.seg i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--bc) 0 8px,transparent 8px 10px);animation:pulse 2.4s steps(2) infinite}
.dust{position:absolute;pointer-events:none;background:var(--c);animation:tw 3.5s steps(2) infinite}
.menu{background:var(--c);border-color:var(--c);color:#0a0807;box-shadow:4px 4px 0 #7a3a24;font-family:'Press Start 2P',monospace;font-size:16px;gap:14px;animation:mg 1.6s steps(2) infinite}
.menu:hover{border-color:var(--k)}
.eye{transform-box:fill-box;transform-origin:center;animation:eye 4s steps(1) infinite}
.bot{animation:bob 2.4s steps(4) infinite}
.blink{animation:blink 1s steps(1) infinite}
.bt{animation:fadein .9s ease-out both;animation-delay:var(--d,0s)}
.chk{position:absolute;opacity:0;pointer-events:none}
.pop{display:none;position:absolute;inset:0;z-index:20;align-items:center;justify-content:center}
.chk:checked ~ .pop{display:flex}
.bd{position:absolute;inset:0;background:rgba(6,4,3,.8);backdrop-filter:blur(8px);cursor:pointer;animation:fadein .3s ease-out both}
.pw{position:relative;z-index:1;background:#120d0b;border:2px solid var(--c);box-shadow:8px 8px 0 #000;box-sizing:border-box;animation:popin .45s steps(6,end) both}
.chk:checked ~ .pop .tile{animation:fadein .5s ease-out both;animation-delay:calc(.3s + var(--i) * .045s)}
.tile{flex-direction:column;gap:10px;font-family:'VT323',monospace;font-size:30px;letter-spacing:3px;color:var(--c)}
.tile span{color:var(--k)}
.tile.on{border-color:var(--c);box-shadow:4px 4px 0 #7a3a24}
.tile .ic{width:52px;height:52px}
.key{width:150px;height:76px;font-family:'Press Start 2P',monospace;font-size:26px;color:var(--k)}

.ri{background:none;border:0;padding:0;margin:0;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;color:var(--k);font-family:'VT323',monospace;font-size:30px;line-height:1;transition:transform .1s steps(2)}
.ri:hover,.ri:focus-visible{transform:translateX(-5px);outline:none;filter:drop-shadow(0 0 6px var(--rc))}
.mc{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;color:var(--k);font-family:'Press Start 2P',monospace;font-size:11px;transition:transform .1s steps(2)}
.mc:hover{transform:translate(-3px,-3px);filter:drop-shadow(0 0 8px var(--c))}
.tg{height:56px;flex:1;font-family:'Press Start 2P',monospace;font-size:12px;color:#9c8678}
.tg.on{background:var(--c);border-color:var(--c);color:#0a0807}
.eqb{flex:1;height:100%;background:var(--c);transform-origin:bottom;animation:eqs .9s steps(4) infinite}
@keyframes eqs{0%,100%{transform:scaleY(.2)}50%{transform:scaleY(1)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes flt{50%{transform:translateY(-6px)}}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.85}}
@keyframes pulse{50%{opacity:.6}}
@keyframes blink{50%{opacity:0}}
@keyframes mg{50%{box-shadow:4px 4px 0 #7a3a24,0 0 0 5px rgba(232,121,90,.3)}}
@keyframes eye{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.15)}}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes core{50%{opacity:.55}}
@keyframes popin{0%{opacity:0;transform:scale(.8)}100%{opacity:1;transform:none}}
@keyframes up{50%{transform:translateY(-8px)}}
</style>
